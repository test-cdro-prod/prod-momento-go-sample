apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow

on:
  workflow_dispatch:

jobs:
  build:
    steps:
      - name: Say hello
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world"

          apk add --update curl > /dev/null 2>&1
          apk add --update jq > /dev/null 2>&1 

          ORG_ID="fafadf1d-159d-447b-46e9-a0193467420e"
          COMPONENT_ID="603bd16c-97cd-45fe-9c48-359e86f24a52"
          TRIGGER_URL="https://api.cloudbees.io/v2/components/${COMPONENT_ID}/trigger"
          POLL_URL="https://api.cloudbees.io/v1/organizations/${ORG_ID}/components/${COMPONENT_ID}/runs?last=1&filter.workflowName=api-regression"

          POLL_INTERVAL=30
          MAX_WAIT=3600  # 60 minutes

          echo "Triggering workflow..."
          TRIGGER_BODY_FILE=$(mktemp)
          HTTP_CODE=$(curl --silent --output "$TRIGGER_BODY_FILE" --write-out "%{http_code}" --location "$TRIGGER_URL" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${{secrets.QA_DEPLOYMENT_TOKEN}}" \
            --data "{
                    \"componentId\": \"${COMPONENT_ID}\",
                    \"branchName\": \"cbp-48875\",
                    \"workflowFileName\": \"api-regression.yaml\",
                    \"inputs\": {
                      \"environment\": \"QA\",
                      \"runId\": \"${{ cloudbees.run_id }}\"
                    }
                  }")

          HTTP_BODY=$(cat "$TRIGGER_BODY_FILE")
          rm -f "$TRIGGER_BODY_FILE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: Trigger request failed with HTTP $HTTP_CODE" >&2
            echo "$HTTP_BODY" >&2
            exit 1
          fi

          TRIGGER_ID=$(echo "$HTTP_BODY" | jq -r '.triggerId // empty')
          echo "Trigger successful. triggerId: ${TRIGGER_ID}"

          echo "Waiting 40 seconds before polling..."
          sleep 40

          ELAPSED=0

          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            POLL_RESPONSE=$(curl --silent --location "$POLL_URL" \
              --header 'Accept: application/json' \
              --header "Authorization: Bearer ${{secrets.QA_DEPLOYMENT_TOKEN}}")

            STATUS=$(echo "$POLL_RESPONSE" | jq -r '.runs[0].status // empty')

            echo "[$(date '+%H:%M:%S')] Status: ${STATUS:-UNKNOWN} (elapsed: ${ELAPSED}s)"

            if [ "$STATUS" = "SUCCEEDED" ]; then
              echo "Run completed successfully."
              exit 0
            elif [ "$STATUS" = "FAILED" ]; then
              echo "Run failed." >&2
              exit 0
            fi

            ELAPSED=$((ELAPSED + POLL_INTERVAL))
            sleep "$POLL_INTERVAL"
          done

          echo "ERROR: Timed out after ${MAX_WAIT}s waiting for run to complete." >&2
          exit 1